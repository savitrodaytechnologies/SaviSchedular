<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SaviSchedular v2.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-glow: rgba(79, 70, 229, 0.35);
      --accent: #06b6d4;
      --dark-bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.6);
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      background-image: 
        radial-gradient(at 15% 15%, rgba(79, 70, 229, 0.25) 0px, transparent 50%),
        radial-gradient(at 85% 85%, rgba(6, 182, 212, 0.2) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      overflow: hidden;
      position: relative;
    }

    /* Ambient animated background grid */
    body::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      transform: rotate(15deg);
      pointer-events: none;
    }

    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        0 0 30px var(--primary-glow);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(79, 70, 229, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 8px 16px;
      border-radius: 50px;
      margin-bottom: 20px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #fff;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .brand-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .login-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 16px;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      height: 48px;
      padding: 0 16px 0 42px;
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 15px;
      transition: all 0.25s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
      background: rgba(15, 23, 42, 0.8);
    }

    .password-toggle {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      transition: color 0.2s;
    }

    .password-toggle:hover { color: var(--text-main); }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 13.5px;
    }

    .remember-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .remember-wrap input[type="checkbox"] {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .btn-login {
      width: 100%;
      height: 50px;
      background: linear-gradient(135deg, var(--primary), #6366f1);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px var(--primary-glow);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px -5px var(--primary-glow);
      background: linear-gradient(135deg, var(--primary-hover), #4f46e5);
    }

    .btn-login:active { transform: translateY(0); }

    .btn-login .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-alert {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13.5px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .hint-box {
      margin-top: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      color: #cbd5e1;
      text-align: center;
    }

    .hint-box code {
      background: rgba(79, 70, 229, 0.3);
      color: #a5b4fc;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      
      <div class="brand-badge">
        <div class="brand-icon">⚡</div>
        <div class="brand-name">SaviSchedular v2.0</div>
      </div>

      <h2 class="login-title">Welcome Back</h2>
      <p class="login-subtitle">Sign in to access your scheduler console</p>

      <div class="error-alert" id="error-alert">
        <span>⚠️</span>
        <span id="error-msg">Invalid credentials.</span>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="username" class="form-input" placeholder="Enter username" required autofocus autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" class="form-input" placeholder="Enter password" required autocomplete="current-password">
            <button type="button" class="password-toggle" onclick="togglePasswordVisibility()" title="Toggle Password">👁️</button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-wrap">
            <input type="checkbox" id="remember" checked>
            <span>Remember me</span>
          </label>
        </div>

        <button type="submit" class="btn-login" id="btn-submit">
          <div class="spinner" id="btn-spinner"></div>
          <span id="btn-text">Sign In ➔</span>
        </button>
      </form>

      <div class="hint-box">
        🔑 Initial SuperAdmin: <code>admin</code> / <code>Admin@123</code>
      </div>

      <div class="login-footer">
        &copy; 2026 Savitroday Technologies. All Rights Reserved.
      </div>
    </div>
  </div>

  <script>
    // Auto-redirect if already logged in
    (function checkSession() {
      const token = localStorage.getItem('savi_schedular_session') || sessionStorage.getItem('savi_schedular_session');
      if (token) {
        window.location.href = '/admin.html';
      }
    })();

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
      } else {
        pwdInput.type = 'password';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const rememberInput = document.getElementById('remember');
      const errorAlert    = document.getElementById('error-alert');
      const errorMsg      = document.getElementById('error-msg');
      const btnSubmit     = document.getElementById('btn-submit');
      const btnSpinner    = document.getElementById('btn-spinner');
      const btnText       = document.getElementById('btn-text');

      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      if (!username || !password) return;

      // Reset alert
      errorAlert.style.display = 'none';
      btnSubmit.disabled = true;
      btnSpinner.style.display = 'block';
      btnText.textContent = 'Authenticating...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Login failed. Please check credentials.');
        }

        // Save session
        const sessionData = JSON.stringify({
          token: data.token,
          userId: data.userId,
          username: data.username,
          fullName: data.fullName,
          role: data.role
        });

        if (rememberInput.checked) {
          localStorage.setItem('savi_schedular_session', sessionData);
        } else {
          sessionStorage.setItem('savi_schedular_session', sessionData);
        }

        // Success redirect
        btnText.textContent = 'Redirecting...';
        setTimeout(() => {
          window.location.href = '/admin.html';
        }, 300);

      } catch (err) {
        errorMsg.textContent = err.message;
        errorAlert.style.display = 'flex';
        btnSubmit.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.textContent = 'Sign In ➔';
      }
    }
  </script>
</body>
</html>
